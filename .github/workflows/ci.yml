name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint, ClaudeMD, and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ai-dev-tools for linter
        uses: actions/checkout@v4
        with:
          repository: DontKwo/ai-dev-tools
          path: .toolchain/ai-dev-tools

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ClaudeMD Strict Linter
        run: uv run --no-project python .toolchain/ai-dev-tools/scripts/claudemd_linter.py . --level strict

      - name: Display Lint Report on Failure
        if: failure()
        run: |
          find .toolchain/ai-dev-tools/scripts/ -name "lint_report*.txt" -exec cat {} + || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Dependency Cruiser architecture check
        run: pnpm exec depcruise packages apps

      - name: Run test suite
        run: pnpm run test

  android-debug-apk:
    name: Build Android APK
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web application
        run: pnpm --filter app run build

      - name: Sync Capacitor Android
        run: cd apps/app && npx cap sync android

      - name: Build Android Debug APK
        run: cd apps/app/android && chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Stage APK for release
        run: cp apps/app/android/app/build/outputs/apk/debug/app-debug.apk formulaflash-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: formulaflash-debug.apk

      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Latest Build (Android APK)"
          body: |
            Automated Android build generated on push to `main` (${{ github.sha }}).

            ### Direct Download
            Download and install directly on Android:
            - **[formulaflash-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/formulaflash-debug.apk)**
          prerelease: true
          make_latest: true
          files: formulaflash-debug.apk
