name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FormulaFlash
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Clone ai-dev-tools
        shell: bash
        run: git clone --depth 1 https://github.com/DontKwo/ai-dev-tools.git "${{ runner.temp }}/_aitools"

      - name: Run Strict Linter and Link Check
        shell: bash
        run: |
          if ! uv run --no-project python "${{ runner.temp }}/_aitools/scripts/claudemd_linter.py" . --level strict --full --no-cache; then
            cat "${{ runner.temp }}/_aitools/scripts"/lint_report_*.txt || true
            exit 1
          fi
          uv run --no-project python "${{ runner.temp }}/_aitools/scripts/link_checker.py" .

      - name: Install Workspace Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run ESLint, Typecheck, Architecture, Unit & Smoke Tests
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm exec depcruise packages apps
          pnpm run test
          pnpm --filter app run build
          npx playwright install --with-deps chromium
          pnpm run test:smoke

      - name: Compute Next SemVer Release Version
        id: ver
        shell: python
        run: |
          import os, re, subprocess
          ref = os.environ.get("GITHUB_REF", "")
          tag_match = re.match(r"^refs/tags/v(\d+\.\d+\.\d+)$", ref.strip())
          if tag_match:
              ver_str = tag_match.group(1)
          else:
              subprocess.run(["git", "fetch", "--tags", "--force"], check=False)
              raw_tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
              semvers = []
              for t in raw_tags:
                  m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", t.strip())
                  if m:
                      semvers.append(tuple(int(x) for x in m.groups()))
              base = max(semvers) if semvers else (0, 1, 0)
              next_ver = (base[0], base[1], base[2] + 1) if f"v{base[0]}.{base[1]}.{base[2]}" in raw_tags else base
              ver_str = f"{next_ver[0]}.{next_ver[1]}.{next_ver[2]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={ver_str}\ntag=v{ver_str}\n")
          print(f"Resolved version v{ver_str}")
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install and Build Windows Executable
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter app run build
          pnpm run build:desktop
          .\build\FormulaFlash-Windows.exe --self-test

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build/FormulaFlash-Windows.exe

  build-macos:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build macOS Standalone Bundle and Self-Test
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter app run build
          python3 -m pip install --upgrade pip pyinstaller pillow
          node scripts/build_desktop_unix.cjs --platform macos --self-test

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: build/FormulaFlash-macOS.zip

  build-linux:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build Linux Standalone Bundle and Self-Test
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter app run build
          python3 -m pip install --upgrade pip pyinstaller pillow
          node scripts/build_desktop_unix.cjs --platform linux --self-test

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: build/FormulaFlash-Linux.tar.gz

  build-android:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Sync Web Bundle and Build Signed Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter app run build
          (cd apps/app && npx cap sync android)
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          KEYSTORE_TMP="$(mktemp /tmp/formulaflash-ks-XXXXXX.jks)"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_TMP"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_TMP"
          (
            cd apps/app/android
            chmod +x ./gradlew
            ./gradlew assembleRelease --console=plain
          )
          rm -f "$KEYSTORE_TMP"
          APK_PATH="apps/app/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -q "CN=Android Debug"; then
            echo "ERROR: APK is signed with debug certificate" >&2
            exit 1
          fi
          if ! echo "$CERT_INFO" | grep -q "CN=FormulaFlash"; then
            echo "ERROR: APK missing CN=FormulaFlash certificate" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_PATH" release-assets/FormulaFlash-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: release-assets/FormulaFlash-Android.apk

  release:
    needs: [lint-and-test, build-windows, build-macos, build-linux, build-android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.lint-and-test.outputs.tag }}
          name: FormulaFlash ${{ needs.lint-and-test.outputs.tag }}
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            artifacts/windows-package/FormulaFlash-Windows.exe
            artifacts/macos-package/FormulaFlash-macOS.zip
            artifacts/linux-package/FormulaFlash-Linux.tar.gz
            artifacts/android-package/FormulaFlash-Android.apk

  update-screenshots:
    name: Refresh Out-of-Sync Screenshots
    needs: lint-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Clone ai-dev-tools
        shell: bash
        run: git clone --depth 1 https://github.com/DontKwo/ai-dev-tools.git "${{ runner.temp }}/_aitools"

      - name: Build Bundle, Capture and Sync Screenshots
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter app run build
          uv run --no-project --with playwright --with pillow python -m playwright install --with-deps chromium
          uv run --no-project --with playwright --with pillow python scripts/capture_screenshots.py --out-dir /tmp/ff-shots
          uv run --no-project --with pillow python "${{ runner.temp }}/_aitools/scripts/capture_screenshots.py" --sync-dir /tmp/ff-shots assets/screenshots --threshold 2.0
          if [ -n "$(git status --porcelain assets/screenshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/screenshots
            git commit -m "chore(screenshots): refresh app screenshots [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
