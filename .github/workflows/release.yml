name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter app run build
      - run: cd apps/app && npx cap sync android
      - run: cd apps/app/android && chmod +x ./gradlew && ./gradlew assembleRelease
      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: apps/app/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/app/android/app/build/outputs/apk/release/app-release-unsigned.apk
